  <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0538">
    <title>Fruit Columns Mobile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">FRUIT COLUMNS</h1>
        <div class="button-container">
            <button id="btnPause" onclick="togglePause()">Pausar</button>
            <button id="btnReset" onclick="resetGame()">Recomeçar</button>
        </div>
       <div id="info">
    <div>Pontos: <span id="score">0</span></div>
    <div id="next-piece-container">Prox: <span id="nextPiece"></span></div>
    <div>Recorde: <span id="highScore">0</span></div>
</div>   
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="mobile-controls">
            <button class="ctrl-btn" id="btnLeft">⬅️</button>
            <div class="vertical-btns">
                <button class="ctrl-btn action-btn" id="btnRotate">🔄</button>
                <button class="ctrl-btn" id="btnDown">⬇️</button>
            </div>
            <button class="ctrl-btn" id="btnRight">➡️</button>
        </div>
    </div>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then(reg => {
                setInterval(() => { reg.update(); }, 1000 * 60 * 5);
                reg.onupdatefound = () => {
                    const installingWorker = reg.installing;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            installingWorker.postMessage({ action: 'skipWaiting' });
                        }
                    };
                };
            });
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) { window.location.reload(); refreshing = true; }
            });
        });
    }
    </script>
    <script src="script.js"></script>
</body>
</html>

  <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0538">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Fruit Columns Mobile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">FRUIT COLUMNS</h1>

        <div class="button-container">
            <button id="btnPause" onclick="togglePause()">Pausar</button>
            <button id="btnReset" onclick="resetGame()">Recomeçar</button>
        </div>
        
        <div id="info">
            <div>Nível: <span id="level">1</span></div>
            <div>Pontos: <span id="score">0</span></div>
            <div class="high-score-label">Recorde: <span id="highScore">0</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div class="mobile-controls">
            <button class="ctrl-btn" id="btnLeft">⬅️</button>
            <div class="vertical-btns">
                <button class="ctrl-btn action-btn" id="btnRotate">🔄</button>
                <button class="ctrl-btn" id="btnDown">⬇️</button>
            </div>
            <button class="ctrl-btn" id="btnRight">➡️</button>
        </div>
    </div>

<button id="update-banner" onclick="window.location.reload()">
    ✨ Nova atualização disponível! Toque para atualizar.
</button>

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        
        // Verifica se há atualização no servidor a cada 5 minutos
        setInterval(() => {
          reg.update();
        }, 1000 * 60 * 5);

        reg.onupdatefound = () => {
          const installingWorker = reg.installing;
          installingWorker.onstatechange = () => {
            if (installingWorker.state === 'installed') {
              if (navigator.serviceWorker.controller) {
                // Nova versão detectada! Pula espera e recarrega.
                installingWorker.postMessage({ action: 'skipWaiting' });
              }
            }
          };
        };
      });

      // Recarrega a página automaticamente quando o novo SW assume
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          window.location.reload();
          refreshing = true;
        }
      });
    });
  }
</script>

    <script src="script.js"></script>
    <script src="script.js?v=2"></script>
</body>
</html>

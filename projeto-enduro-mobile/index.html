 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Enduro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="game-container">
        <div class="jogo-titulo">MINI ENDURO</div>

        <div class="dashboard-externa">
            <div class="stat-box"><span class="label">DISTÂNCIA</span><span id="ui-dist" class="value">0.0 KM</span></div>
            <div class="stat-box"><span class="label">RECORDE DIA</span><span id="ui-day-best" class="value">0.0 KM</span></div>
            <div class="stat-box"><span class="label">ODÔMETRO</span><span id="ui-total-now" class="value">0.0 KM</span></div>
            <div class="stat-box"><span class="label">RECORDE TOTAL</span><span id="ui-total-best" class="value">0.0 KM</span></div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="mobile-controls">
            <div class="touch-btn" id="mobileLeft">◀</div> 
            <div class="touch-btn" id="mobileRight">▶</div> 
        </div>

        <div class="controles">
            <button onclick="togglePause()" id="pauseBtn">Pausar</button>
            <button onclick="resetGame()">Reiniciar</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            newWorker.postMessage('skipWaiting');
                        }
                    });
                });
            });
            let refreshing;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                window.location.reload();
                refreshing = true;
            });
        }
    </script>
</body>
</html>

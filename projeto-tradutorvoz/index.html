<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradutor de Voz Poliglota</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

     <div class="app-card">
    <header>
        <h2>🎙️ Chat Bilíngue</h2>
        <select id="foreignLang">
            <option value="en-US">Inglês (USA)</option>
            <option value="es-ES">Espanhol (España)</option>
            <option value="fr-FR">Francês (France)</option>
        </select>
    </header>

    <div class="chat-container">
        <div class="message-box">
            <small id="labelForeign">Estrangeiro diz:</small>
            <div id="textForeign" class="bubble original">...</div>
            <div id="textToPt" class="bubble translation">Tradução para PT aparecerá aqui...</div>
            <button id="btnForeign" class="btn-mic small">🎤 Ouvir Estrangeiro</button>
        </div>

        <hr>

        <div class="message-box">
            <small>Você diz (Português):</small>
            <div id="textMe" class="bubble original">...</div>
            <div id="textToForeign" class="bubble translation">Tradução para o idioma dele...</div>
            <button id="btnMe" class="btn-mic small btn-pt">🎤 Eu falar (PT)</button>
        </div>
    </div>
    
    <div id="statusLabel" class="status">Escolha quem vai falar</div>
</div>

    <script src="script.js"></script>
</body>
</html>

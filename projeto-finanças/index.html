 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fluxo de Caixa</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">
    
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body onload="inicializar()">

<div class="container">
    <h2>Fluxo de Caixa Mensal</h2>

    <div class="seletor-mes">
        <strong>Mês de Referência:</strong>
        <input type="month" id="mes-referencia" onchange="atualizarInterface()" style="width: auto; margin: 0;">
    </div>

    <div class="resumo">
        Saldo do Mês: <span id="valor-total">R$ 0,00</span>
    </div>

    <div class="grupo-inputs">
        <input type="number" id="dia" placeholder="Dia" min="1" max="31" title="Dia do lançamento">
        <input type="text" id="descricao" placeholder="Descrição (ex: Venda de produto)">
    </div>
    
    <input type="number" id="valor" step="0.01" placeholder="Valor (R$)">
    
    <div class="botoes-tipo">
        <button type="button" id="btn-tipo-receita" class="btn-tipo receita ativo" onclick="selecionarTipo('receita')">Receita (+)</button>
        <button type="button" id="btn-tipo-despesa" class="btn-tipo despesa" onclick="selecionarTipo('despesa')">Despesa (-)</button>
    </div>
    
    <button class="btn-pdf" onclick="exportarPDF()">Gerar Extrato Mensal PDF</button>

    <div class="filtros">
        <button class="btn-filtro ativo" id="f-todos" onclick="filtrar('todos')">Tudo</button>
        <button class="btn-filtro" id="f-receita" onclick="filtrar('receita')">Receitas</button>
        <button class="btn-filtro" id="f-despesa" onclick="filtrar('despesa')">Despesas</button>
    </div>

    <table id="tabela-contas">
        <thead>
            <tr>
                <th>Dia</th>
                <th>Descrição</th>
                <th>Valor</th>
                <th class="col-tipo">Tipo</th>
                <th class="col-saldo">Saldo</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <!-- SEÇÃO ANUAL COM PDF ANUAL E ENCERRAMENTO -->
    <div class="secao-anual">
        <h3>Balanço Anual (<span id="ano-atual-label"></span>)</h3>
        
        <table id="tabela-anual">
            <thead>
                <tr>
                    <th>Mês</th>
                    <th>Receitas</th>
                    <th>Despesas</th>
                    <th>Saldo</th>
                </tr>
            </thead>
            <tbody></tbody>
            <tfoot></tfoot>
        </table>

        <div class="container-grafico">
            <canvas id="graficoAnual"></canvas>
        </div>

        <div class="acoes-anuais">
            <button class="btn-pdf-anual" onclick="exportarPDFAnual()">Gerar Balanço Anual PDF</button>
            <button class="btn-zerar-ano" onclick="zerarAnoAtual()">Encerrar e Zerar Ano</button>
        </div>
    </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => {
          console.log('Service Worker registrado com sucesso!');
        })
        .catch(err => console.log('Erro ao registrar o Service Worker:', err));
    });
  }
</script>

<script src="script.js"></script>
</body>
</html>

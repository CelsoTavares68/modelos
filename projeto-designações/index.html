  <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadro de Designações</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="icon-512.png">
    <link rel="icon" type="image/png" href="icon-512.png">

    <link rel="stylesheet" href="style.css">

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js")
                    .then(reg => console.log("Service Worker registrado!"))
                    .catch(err => console.log("Erro ao registrar SW:", err));
            });
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Quadro de Designações</h1>

        <div class="form-container">
            <div class="full-width">
                <label>Mês de Referência:</label>
                <input type="month" id="mes-referencia">
            </div>
            
            <input type="date" id="data">
            <input type="text" id="presidente" placeholder="Presidente">
            <input type="text" id="entrada" placeholder="Indicador Entrada">
            <input type="text" id="auditorio_palco_volante" placeholder="Auditório / Palco / Volante">
            <input type="text" id="leitor" placeholder="Leitor">
            <input type="text" id="audioVideo" placeholder="Áudio e Vídeo">
            
            <div class="full-width">
                <textarea id="observacao" placeholder="Observações para este dia..."></textarea>
            </div>

            <div class="full-width" style="display: flex; align-items: center; gap: 10px; background: #fff9c4; padding: 10px; border-radius: 5px;">
                <input type="checkbox" id="data-especial" style="width: auto;">
                <label for="data-especial" style="font-weight: bold; color: #856404;">Destacar esta linha (Cor Amarela)</label>
            </div>

            <button id="btn-adicionar">
                <i class="fa-solid fa-plus"></i> Adicionar à Escala
            </button>
        </div>

        <div class="table-responsive">
            <table id="tabela-designacoes">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Presidente</th>
                        <th>Entrada</th>
                        <th>Auditório / Palco / Volante</th>
                        <th>Leitor</th>
                        <th>Áudio/Vídeo</th>
                        <th class="no-print">Ações</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela"></tbody>
            </table>
        </div>

        <div id="container-observacoes"></div>

        <div class="footer-buttons">
            <button id="btn-gerar-pdf" class="btn-pdf">
                <i class="fa-solid fa-share-nodes"></i> Gerar e Compartilhar PDF
            </button>
            <button id="btn-limpar-tudo" class="btn-limpar">
                <i class="fa-solid fa-trash-can"></i> Apagar Tudo
            </button>
        </div>
    </div>

    <div id="loading-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; color: white; font-family: sans-serif;">
        <div style="border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite;"></div>
        <p style="margin-top: 15px;">Processando PDF...</p>
    </div>

    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media print { .no-print, .form-container, .footer-buttons { display: none !important; } }
    </style>

    <script src="script.js"></script>
</body>
</html>

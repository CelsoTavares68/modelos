 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#223344">
    <title>Xadrez Medieval 3D</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        #placar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 50px;
            font-family: 'Cinzel', serif;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            z-index: 10;
            pointer-events: none;
        }
        .vitorias { text-align: center; }
        .vitorias span { display: block; font-size: 1.5rem; color: #ffcc00; }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <div id="placar">
            <div class="vitorias">CINZAS<span id="vitorias-cinza">0</span></div>
            <div class="vitorias">BRANCAS<span id="vitorias-branca">0</span></div>
        </div>

        <div id="status-panel">
            <div id="turn-indicator">VEZ DAS BRANCAS</div>
            
            <div class="controls-row">
                <select id="game-mode">
                    <option value="pve">Humano vs PC</option>
                    <option value="pvp">Humano vs Humano</option>
                </select>
                
                <select id="difficulty-level">
                    <option value="easy">Fácil</option>
                    <option value="hard">Difícil</option>
                </select>
                
                <button id="reset-button" class="btn-ui">Novo Jogo</button>
            </div>
        </div>
        
        <div id="message-log">Toque em uma peça</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
